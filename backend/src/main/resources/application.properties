spring.application.name=urbanrisk
server.port=8080

# Banco H2 salvo em arquivo local (mantem os dados ao parar e religar o servidor)
spring.datasource.url=jdbc:h2:file:./data/urbanriskdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update